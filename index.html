<!DOCTYPE html>
<html>
<head>
<title>Important Message</title>

<style>
body {
    margin: 0;
    background: black;
    overflow: hidden;
    cursor: pointer;
    font-family: Arial, sans-serif;
}

/* Start text */
.centerText {
    color: white;
    font-size: 28px;
    text-align: center;
    margin-top: 40vh;
}

/* Images */
img {
    position: absolute;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    display: none;
}

/* Sudden white flash */
.whiteFlash {
    animation: flashWhite 0.15s 3;
}

@keyframes flashWhite {
    0% { background: white; }
    100% { background: black; }
}

/* Violent shake */
.shakeScreen {
    animation: shakeScreen 0.05s infinite;
}

@keyframes shakeScreen {
    0% { transform: translate(15px, 15px); }
    25% { transform: translate(-15px, -15px); }
    50% { transform: translate(15px, -15px); }
    75% { transform: translate(-15px, 15px); }
    100% { transform: translate(15px, 15px); }
}

/* Glitch color split */
.glitch {
    animation: glitch 0.1s infinite;
}

@keyframes glitch {
    0% { filter: contrast(200%) hue-rotate(0deg); }
    50% { filter: contrast(400%) hue-rotate(180deg); }
    100% { filter: contrast(200%) hue-rotate(360deg); }
}

/* Popup */
#popup {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: white;
    padding: 30px;
    border-radius: 15px;
    text-align: center;
    display: none;
    z-index: 9999;
}

button {
    padding: 10px 20px;
    margin: 10px;
    font-size: 18px;
    cursor: pointer;
}
</style>
</head>

<body onclick="startPrank()">

<div class="centerText" id="startText">
    Click here. It’s VERY important 😌
</div>

<img id="hisPic" src="boyfriend.jpg">
<img id="youPic" src="me.jpg">

<div id="popup">
    <h2>Do you like Noor?</h2>
    <button onclick="endPrank()">Yes 😍</button>
    <button onclick="endPrank()">Absolutely Yes 😌</button>
</div>

<!-- ⚠️ Replace scream.mp3 with a REAL scream sound file -->
<audio id="scream">
    <source src="scream.mp3" type="audio/mpeg">
</audio>

<script>
let started = false;
let glitchInterval;

function startPrank() {
    if (started) return;
    started = true;

    document.getElementById("startText").style.display = "none";

    // Small delay before scare (tension)
    setTimeout(() => {

        const hisPic = document.getElementById("hisPic");
        hisPic.style.display = "block";

        document.body.classList.add("whiteFlash");

        setTimeout(() => {
            document.body.classList.add("shakeScreen", "glitch");
        }, 150);

        // HARD zoom effect
        hisPic.style.transform = "scale(1.8)";

        // Random jitter zoom
        glitchInterval = setInterval(() => {
            hisPic.style.transform =
                `translate(${Math.random()*40-20}px, ${Math.random()*40-20}px)
                 scale(${1.5 + Math.random()*0.7})`;
        }, 60);

        // Play scream LOUD
        const scream = document.getElementById("scream");
        scream.volume = 1.0;
        scream.play();

        // Show popup after chaos
        setTimeout(() => {
            document.getElementById("popup").style.display = "block";
        }, 4000);

    }, 1200); // suspense delay
}

function endPrank() {

    document.body.classList.remove("whiteFlash", "shakeScreen", "glitch");

    document.getElementById("hisPic").style.display = "none";
    document.getElementById("popup").style.display = "none";
    document.getElementById("youPic").style.display = "block";

    clearInterval(glitchInterval);

    const scream = document.getElementById("scream");
    scream.pause();
    scream.currentTime = 0;
}
</script>

</body>
</html>

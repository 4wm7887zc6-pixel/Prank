<!DOCTYPE html>
<html>
<head>
<title>Important Message</title>

<style>
body {
    margin: 0;
    background: black;
    overflow: hidden;
    cursor: pointer;
    font-family: Arial, sans-serif;
}

/* Start text */
.centerText {
    color: white;
    font-size: 28px;
    text-align: center;
    margin-top: 40vh;
}

/* Images */
img {
    position: absolute;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    display: none;
    transition: transform 0.05s linear;
}

/* FLASH */
.flash {
    animation: flashRed 0.07s infinite;
}

@keyframes flashRed {
    0% { background: red; }
    50% { background: black; }
    100% { background: red; }
}

/* SHAKE */
.shakeScreen {
    animation: shakeScreen 0.05s infinite;
}

@keyframes shakeScreen {
    0% { transform: translate(20px, 20px); }
    25% { transform: translate(-20px, -20px); }
    50% { transform: translate(20px, -20px); }
    75% { transform: translate(-20px, 20px); }
    100% { transform: translate(20px, 20px); }
}

/* GLITCH EFFECT */
.glitch {
    animation: glitch 0.08s infinite;
}

@keyframes glitch {
    0% { filter: contrast(200%) hue-rotate(0deg); }
    50% { filter: contrast(500%) hue-rotate(180deg); }
    100% { filter: contrast(200%) hue-rotate(360deg); }
}

/* POPUP */
#popup {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: white;
    padding: 30px;
    border-radius: 15px;
    text-align: center;
    display: none;
    z-index: 9999;
}

button {
    padding: 10px 20px;
    margin: 10px;
    font-size: 18px;
    cursor: pointer;
}
</style>
</head>

<body onclick="startPrank()">

<div class="centerText" id="startText">
    Click here. It’s VERY important 😌
</div>

<img id="hisPic" src="./boyfriend.jpg">
<img id="youPic" src="./me.jpg">

<div id="popup">
    <h2>Do you like Noor?</h2>
    <button onclick="endPrank()">Yes 😍</button>
    <button onclick="endPrank()">Also Yes 😌</button>
</div>

<!-- Local scream file -->
<audio id="scream" preload="auto">
    <source src="./scream.mp3" type="audio/mpeg">
</audio>

<script>
let started = false;
let glitchInterval;

function startPrank() {

    if (started) return;
    started = true;

    const scream = document.getElementById("scream");
    const hisPic = document.getElementById("hisPic");

    document.getElementById("startText").style.display = "none";

    // Short suspense delay
    setTimeout(() => {

        hisPic.style.display = "block";

        document.body.classList.add("flash", "shakeScreen", "glitch");

        // Hard zoom attack
        hisPic.style.transform = "scale(2)";

        // Random violent jitter
        glitchInterval = setInterval(() => {
            hisPic.style.transform =
                `translate(${Math.random()*60-30}px, ${Math.random()*60-30}px)
                 scale(${1.8 + Math.random()*0.8})`;
        }, 50);

        // Play scream (works because user clicked page)
        scream.volume = 1.0;
        scream.currentTime = 0;
        scream.play();

        // Show popup after chaos
        setTimeout(() => {
            document.getElementById("popup").style.display = "block";
        }, 4000);

    }, 800);
}

function endPrank() {

    document.body.classList.remove("flash", "shakeScreen", "glitch");

    document.getElementById("hisPic").style.display = "none";
    document.getElementById("popup").style.display = "none";
    document.getElementById("youPic").style.display = "block";

    clearInterval(glitchInterval);

    const scream = document.getElementById("scream");
    scream.pause();
    scream.currentTime = 0;
}
</script>

</body>
</html>

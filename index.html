<!DOCTYPE html>  
<html>  
<head>  
    <title>Important Message</title>  
  
    <style>  
        body {  
            margin: 0;  
            background: black;  
            overflow: hidden;  
            cursor: pointer;  
        }  
  
        .centerText {  
            color: white;  
            font-family: Arial, sans-serif;  
            font-size: 28px;  
            text-align: center;  
            margin-top: 40vh;  
        }  
  
        img {  
            position: absolute;  
            width: 100vw;  
            height: 100vh;  
            object-fit: contain;  
            display: none;  
        }  
  
        #youPic {  
            background: black;  
        }  
  
        .flash {  
            animation: flashRed 0.1s infinite;  
        }  
  
        @keyframes flashRed {  
            0% { background: red; }  
            50% { background: black; }  
            100% { background: red; }  
        }  
  
        .shake {  
            animation: shake 0.2s infinite;  
        }  
  
        @keyframes shake {  
            0% { transform: translate(5px, 5px); }  
            25% { transform: translate(-5px, -5px); }  
            50% { transform: translate(5px, -5px); }  
            75% { transform: translate(-5px, 5px); }  
            100% { transform: translate(5px, 5px); }  
        }  
  
        #message {  
            position: absolute;  
            width: 100%;  
            text-align: center;  
            top: 75%;  
            color: white;  
            font-size: 40px;  
            font-family: Arial, sans-serif;  
            display: none;  
        }  
    </style>  
</head>  
  
<body onclick="startPrank()">  
  
<div class="centerText" id="startText">  
    Click here. It’s important 😌  
</div>  
  
<img id="hisPic" src="boyfriend.jpg">  
<img id="youPic" src="me.jpg">  
  
<div id="message">You’re welcome 😌</div>  
  
<audio id="scream">  
    <source src="https://www.myinstants.com/media/sounds/movie_1.mp3" type="audio/mpeg">  
</audio>  
  
<script>  
let started = false;  
  
function startPrank() {  
    if (started) return;  
    started = true;  
  
    document.getElementById("startText").style.display = "none";  
  
    const hisPic = document.getElementById("hisPic");  
    hisPic.style.display = "block";  
  
    document.body.classList.add("flash");  
    hisPic.classList.add("shake");  
  
    const scream = document.getElementById("scream");  
    scream.volume = 1.0;  
    scream.play();  
  
    // Disable closing tricks  
    window.onbeforeunload = function() {  
        return "Nice try.";  
    };  
  
    // After 3 seconds switch to you  
    setTimeout(() => {  
        document.body.classList.remove("flash");  
        hisPic.classList.remove("shake");  
        hisPic.style.display = "none";  
  
        document.getElementById("youPic").style.display = "block";  
        document.getElementById("message").style.display = "block";  
  
        window.onbeforeunload = null;  
    }, 3000);  
}  
</script>  
  
</body>  
</html>
